name: Build VST3 Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate project files
        shell: bash
        run: |
          # אם CMakeLists.txt לא בתיקייה הראשית, חפש איפה הוא נמצא והעבר את התוכן של התיקייה ההיא למעלה
          if [ ! -f CMakeLists.txt ]; then
            CMAKEDIR=$(find . -maxdepth 3 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
            if [ -n "$CMAKEDIR" ] && [ "$CMAKEDIR" != "." ]; then
              echo "Moving project files from $CMAKEDIR to root"
              shopt -s dotglob
              mv "$CMAKEDIR"/* .
            fi
          fi
          echo "=== Root directory structure ==="
          ls -la

      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build
          fi

      - name: Build Plugin
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ matrix.label }}
          path: |
            build/*_artefacts/Release/VST3
            build/*_artefacts/Release/AU
            build/*_artefacts/Release/Standalone
            build/**/*.vst3
          if-no-files-found: warn
